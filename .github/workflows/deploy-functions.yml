# Deploys the Supabase Edge Functions whenever they change on the main branch, or on demand
# (GitHub -> Actions -> "Deploy Edge Functions" -> Run workflow).
# One-time setup: add two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from the Supabase dashboard (Account -> Access Tokens)
#   SUPABASE_PROJECT_ID    the project's Reference ID (Project Settings -> General)
name: Deploy Edge Functions

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing repository secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing repository secret SUPABASE_PROJECT_ID"; exit 1; }
      - run: supabase functions deploy draft-reset --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy apply-proposal --project-ref "$SUPABASE_PROJECT_ID"
