# Deploys the Supabase Edge Functions whenever they change on the main branch, or on demand
# (GitHub -> Actions -> "Deploy Edge Functions" -> Run workflow).
# One-time setup: add two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from the Supabase dashboard (Account -> Access Tokens)
#   SUPABASE_PROJECT_ID    the project's Reference ID (Project Settings -> General)
name: Deploy Edge Functions

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing repository secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing repository secret SUPABASE_PROJECT_ID"; exit 1; }
      - run: supabase functions deploy draft-reset --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy apply-proposal --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy ask-tandom --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy reset-impact --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy execution-followup --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy manage-users --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy fetch-sheet --project-ref "$SUPABASE_PROJECT_ID"
      - name: Set the Ask Tandom model API key (only if the repository secret exists)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "No ANTHROPIC_API_KEY repository secret — Ask Tandom will answer 'not set up yet' until you add one."
          fi
